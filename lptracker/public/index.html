<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>LP Tracker Riot API</title>
  <style>
    body {
      background: #1a1a2f;
      color: #f4f4f4;
      font-family: sans-serif;
      text-align: center;
      padding-top: 60px;
    }
    h1 {
      color: #00ffc3;
    }
    .data {
      margin-top: 20px;
      font-size: 22px;
    }
  </style>
</head>
<body>
  <h1>LP Gracza: 2024MUSIC#2024</h1>
  <div class="data" id="lp">Ładowanie LP...</div>
  <div class="data" id="to-emerald">Obliczanie...</div>

  <script>
    fetch("/.netlify/functions/fetch-lp")
      .then(res => res.json())
      .then(data => {
        document.getElementById("lp").textContent = 
          `Ranga: ${data.tier} ${data.rank} - ${data.lp} LP`;
        document.getElementById("to-emerald").textContent = 
          `Tyle LP brakuje do Emerald IV: ${data.lpToEmerald}`;
      })
      .catch(err => {
        document.getElementById("lp").textContent = "Błąd ładowania LP.";
        console.error(err);
      });
  </script>
</body>
</html>
